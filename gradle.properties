# Sets default memory used for gradle commands. Can be overridden by user or command line properties.
# This is required to provide enough memory for the Minecraft decompilation process.
org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=false
org.gradle.java.home=E\:\\Program Files\\Java\\jdk-17


## Environment Properties

# The Minecraft version must agree with the Forge version to get a valid artifact
minecraft_version=1.20.1
# The Minecraft version range can use any release version of Minecraft as bounds.
# Snapshots, pre-releases, and release candidates are not guaranteed to sort properly
# as they do not follow standard versioning conventions.
minecraft_version_range=[1.20.1,1.21)
# The Forge version must agree with the Minecraft version to get a valid artifact.
# Keep this at 47.2.0 to match the Forge build Scorched Guns 2 itself ships for,
# so this compat mod never demands a newer loader than the guns mod.
forge_version=47.2.0
# The Forge version range can use any version of Forge as bounds or match the loader version range
forge_version_range=[47,)
# The loader version range can only use the major version of Forge/FML as bounds
loader_version_range=[47,)
# The mapping channel to use for mappings.
mapping_channel=official
# The mapping version to query from the mapping channel.
mapping_version=1.20.1


## Mod Properties

# The unique mod identifier for the mod. Must be lowercase in English locale. Must fit the regex [a-z][a-z0-9_]{1,63}
# Must match the String constant located in the main mod class annotated with @Mod.
mod_id=ysm_scg2_compat
# The human-readable display name for the mod.
mod_name=YSM x Scorched Guns 2 Compat
# The license for the mod.
mod_license=All Rights Reserved
# The authors of the mod.
mod_authors=ysm_scg2_compat
# The description of the mod.
mod_description=Soft compatibility layer that lets Yes Steve Model (OpenYSM) recognise Scorched Guns 2 weapons as TACZ-style guns, so YSM models play their built-in tac:* gun animations while holding an SCG2 weapon. Also restores the [YSM] log probes used to diagnose the interaction.
# The version number of the mod - there's a few well known ${} variables useable here or just hardcode it
# 1.0.0 -> 1.0.1: fixed a startup crash. Forge's @EventBusSubscriber scan used
# Class.forName on Diagnostics/RenderProbe, and those classes named Yes Steve Model
# types in their method signatures, so the JVM's load-time verification failed with
# NoClassDefFoundError: com/elfmcys/yesstevemodel/client/entity/LivingAnimatable.
# All YSM access now goes through client/YsmBridge (reflection only), the subscribers
# are registered by hand, and tools/verify-mixin-targets.ps1 fails the build if any
# non-mixin class names a target-mod type in a load-time position again.
mod_version=1.2.0
# 1.1.0 -> 1.2.0: branch coverage completed against all three YSM builds.
#   - ModernYSM was classified as OpenYSM. Its capability provider lives in a forge subpackage,
#     so the readable path missed and only the structural scan saved it. Detection now uses the
#     reference project's markers: the forge-subpackage provider, or the forge-only render hook.
#   - YSM obfuscates MEMBERS as well as classes. event.getAnimatable() is
#     o0OOooo0o0OO00OoOOOo0o0O() in the official release, so every guard decision read a null
#     animation and declined. Member access now resolves per build (YsmMemberNames).
#   - The obfuscated capability provider and field are named explicitly, verified against the jar.
## A version range to match for said version of the mod loader (Forge)
mod_loader_version_range=[47,)
